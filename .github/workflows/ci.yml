name: ci
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sourcewell
          POSTGRES_PASSWORD: sourcewell
          POSTGRES_DB: sourcewell
        ports:
          - 8902:5432
        options: >-
          --health-cmd "pg_isready -U sourcewell"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql+asyncpg://sourcewell:sourcewell@localhost:8902/sourcewell
      TEST_DATABASE_URL: postgresql+asyncpg://sourcewell:sourcewell@localhost:8902/sourcewell_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - name: create test database
        run: PGPASSWORD=sourcewell psql -h localhost -p 8902 -U sourcewell -d sourcewell -c "CREATE DATABASE sourcewell_test;"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app tests
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # schema.d.ts is generated from the backend's OpenAPI (make gen-api); fail if it went stale.
  schema-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync
        working-directory: backend
      - run: uv run python -m app.openapi_export ../frontend/openapi.json
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run gen:api
        working-directory: frontend
      - run: git diff --exit-code -- frontend/src/lib/api/schema.d.ts
